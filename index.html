<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: #080808;
        }
        .main-video {
            width: 100%;
            height: 70vh;
            object-fit: cover;
        }
    </style>
</head>
<body class="text-white">
    <!-- Top Bar -->
    <header class="fixed w-full z-50 mix-blend-difference">
        <div class="flex justify-between items-center py-6 px-12">
            <span class="text-lg tracking-tight">Blender Copilot</span>
            <button class="text-sm tracking-wide hover:opacity-80">Login</button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Video Section -->
        <div class="relative">
            <video autoplay muted loop playsinline class="main-video">
                <source src="roof_trashcan.mp4" type="video/mp4">
            </video>

            <!-- Overlay Text -->
            <div class="absolute bottom-0 left-0 p-12 w-full bg-gradient-to-t from-black to-transparent">
                <div class="max-w-3xl">
                    <h1 class="text-3xl font-medium mb-3">Bring Your Ideas to Life</h1>
                    <p class="text-gray-400 mb-6">Transform text and images into 3D models instantly using AI</p>
                    <button class="text-sm px-4 py-2 bg-white text-black rounded hover:bg-opacity-90">
                        TRY IT OUT FOR FREE
                    </button>
                </div>
            </div>
        </div>

        <!-- Showcase -->
        <div class="px-12 py-24">
            <div class="max-w-7xl mx-auto">
                <div class="mb-24 flex items-end justify-between">
                    <p class="text-sm text-gray-400 max-w-md">
                        From simple text descriptions to detailed 3D models.
                        See what others have created with Blender Copilot.
                    </p>
                </div>
                <img src="mesh-samples.gif" alt="3D Mesh Samples" class="w-full"/>
            </div>
        </div>
    </main>
</body>
</html>
